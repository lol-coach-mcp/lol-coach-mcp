[project]
name = "lol-coach-mcp"
version = "0.1.0"
description = "개인용 리그 오브 레전드 코칭 MCP 서버"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
lol-coach-mcp = "lol_coach_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_coach_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: 실제 Riot API 호출(RIOT_API_KEY 필요)"]
addopts = "-m 'not live'"
